version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: edugrade-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: edugrade_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: edugrade-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: always

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edugrade-web
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/edugrade_ai?schema=public
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_SECRET=edugrade-ai-super-secret-key-for-development
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      - postgres
      - redis
    restart: always

volumes:
  postgres_data:
  redis_data:
